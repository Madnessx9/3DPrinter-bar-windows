name: Scratch snapshots
on:
  push:
    branches: [ci-snapshots]
permissions:
  contents: write
jobs:
  snap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/BambuBar -c Release
      - shell: pwsh
        run: |
          $exe = 'src\BambuBar\bin\Release\net10.0-windows10.0.19041.0\BambuBar.exe'
          foreach ($look in '--light', '--dark') {
            $p = Start-Process $exe -ArgumentList '--demo', 'printing', '--fleet', '--snapshot', 'out', $look -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill() }
          }
          Get-ChildItem out
      - shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          git add -f out; git commit -m "snapshots"; git push
